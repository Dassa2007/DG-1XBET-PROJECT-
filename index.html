<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Server Cloudinary URL Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        select, input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            word-break: break-all;
        }
        .result a {
            color: #0066cc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Multi-Server URL Generator</h2>
    
    <div class="form-group">
        <label for="serverSelect">සර්වර් එක තෝරන්න (Select Server):</label>
        <select id="serverSelect">
            <option value="server1">Server 1 (Account 1 - 25GB)</option>
            <option value="server2">Server 2 (Account 2 - 25GB)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="fileInput">ගොනුවක් තෝරන්න (Select File):</label>
        <input type="file" id="fileInput">
    </div>
    
    <button type="button" onclick="uploadFile()">ලින්ක් එක ජෙනරේට් කරන්න</button>
    
    <div class="result" id="resultArea"></div>
</div>

<script>
    const server1 = {
        cloudName: "wwb8ifud",[span_0](start_span)[span_0](end_span)
        uploadPreset: "dg_dev[span_1](start_span)"[span_1](end_span)
    };

    const server2 = {
        cloudName: "rakvvolf",
        uploadPreset: "dg_dev1"
    };

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const serverSelect = document.getElementById('serverSelect').value;
        const resultArea = document.getElementById('resultArea');

        if (fileInput.files.length === 0) {
            alert('කරුණාකර මුලින්ම ෆයිල් එකක් තෝරන්න!');
            return;
        }

        const currentServer = (serverSelect === 'server1') ? server1 : server2;
        const file = fileInput.files[0];
        
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', currentServer.uploadPreset); 

        resultArea.innerHTML = 'અප්ලෝඩ් වෙමින් පවතී... කරුණාකර රැඳී සිටින්න.';

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${currentServer.cloudName}/auto/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            
            if (data.secure_url) {
                const longUrl = data.secure_url;
                let shortUrl = longUrl;
                
                try {
                    const shortResponse = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`);
                    if (shortResponse.ok) {
                        const text = await shortResponse.text();
                        if (text && text.startsWith('http')) {
                            shortUrl = text.trim();
                        }
                    }
                } catch (err) {
                    console.log('Shortener error, using direct URL');
                }

                resultArea.innerHTML = `<b>සාර්ථකයි! (${serverSelect}) ඔබේ ලින්ක් එක:</b><br><a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
            } else {
                resultArea.innerHTML = 'අප්ලෝඩ් කිරීම අසාර්ථකයි. නැවත උත්සාහ කරන්න.';
            }
        } catch (error) {
            console.error('Error:', error);
            resultArea.innerHTML = 'දෝෂයක් සිදු විය. අන්තර්ජාල සම්බන්ධතාවය පරීක්ෂා කරන්න.';
        }
    }
</script>

</body>
</html>
