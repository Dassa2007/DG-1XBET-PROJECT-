<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Server Cloudinary URL Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 35px 30px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 440px;
        }
        h2 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }
        select, input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        select:focus, input[type="file"]:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        button {
            width: 100%;
            background: #667eea;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
            margin-top: 5px;
        }
        button:hover {
            background: #5a6fd6;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #f7f8fc;
            border: 1px solid #e2e8f0;
            word-break: break-all;
            font-size: 15px;
            display: none;
        }
        .result.visible {
            display: block;
        }
        .result.success {
            background: #f0fff4;
            border-color: #c6f6d5;
        }
        .result.error {
            background: #fff5f5;
            border-color: #fed7d7;
            color: #c53030;
        }
        .result a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
        .result a:hover {
            text-decoration: underline;
        }
        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 13px;
            background: #edf2f7;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            width: auto;
        }
        .copy-btn:hover {
            background: #e2e8f0;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Multi-Server URL Generator</h2>
    
    <div class="form-group">
        <label for="serverSelect">සර්වර් එක තෝරන්න (Select Server):</label>
        <select id="serverSelect">
            <option value="server1">Server 1 (Account 1 - 25GB)</option>
            <option value="server2">Server 2 (Account 2 - 25GB)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="fileInput">ගොනුවක් තෝරන්න (Select File):</label>
        <input type="file" id="fileInput">
    </div>
    
    <button type="button" id="uploadBtn" onclick="uploadFile()">ලින්ක් එක ජෙනරේට් කරන්න</button>
    
    <div class="result" id="resultArea"></div>
</div>

<script>
    // ✅ දෝෂ නිවැරදි කරන ලද සර්වර් වින්‍යාසයන්
    const servers = {
        server1: {
            cloudName: "wwb8ifud",
            uploadPreset: "dg_dev"
        },
        server2: {
            cloudName: "rakvvolf",
            uploadPreset: "dg_dev1"
        }
    };

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const serverKey = document.getElementById('serverSelect').value;
        const resultArea = document.getElementById('resultArea');
        const uploadBtn = document.getElementById('uploadBtn');

        if (fileInput.files.length === 0) {
            alert('කරුණාකර මුලින්ම ෆයිල් එකක් තෝරන්න!');
            return;
        }

        const currentServer = servers[serverKey];
        if (!currentServer) {
            alert('වලංගු නොවන සර්වර් එකක් තෝරා ඇත.');
            return;
        }

        const file = fileInput.files[0];
        
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', currentServer.uploadPreset); 

        // අප්ලෝඩ් වන අතරතුර බොත්තම අක්‍රීය කර ලෝඩින් එකක් පෙන්වන්න
        uploadBtn.disabled = true;
        resultArea.className = 'result visible';
        resultArea.innerHTML = '<span class="spinner"></span> අප්ලෝඩ් වෙමින් පවතී... කරුණාකර රැඳී සිටින්න.';

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${currentServer.cloudName}/auto/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            
            if (data.secure_url) {
                const longUrl = data.secure_url;
                let shortUrl = longUrl;
                
                // කෙටි URL එකක් උත්සාහ කරන්න (අසාර්ථක වුවහොත් සෘජු URL එක භාවිතා කරන්න)
                try {
                    const shortResponse = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`);
                    if (shortResponse.ok) {
                        const text = await shortResponse.text();
                        if (text && text.startsWith('http')) {
                            shortUrl = text.trim();
                        }
                    }
                } catch (err) {
                    console.log('Shortener error, using direct URL');
                }

                resultArea.className = 'result visible success';
                resultArea.innerHTML = `
                    <strong>✅ සාර්ථකයි! (${serverKey}) ඔබේ ලින්ක් එක:</strong><br><br>
                    <a href="${shortUrl}" target="_blank" rel="noopener">${shortUrl}</a>
                    <br>
                    <button class="copy-btn" onclick="copyToClipboard('${shortUrl}')">📋 Copy Link</button>
                `;
            } else {
                // Cloudinary වෙතින් ලැබෙන දෝෂ පණිවිඩය පෙන්වන්න
                const errorMsg = data.error?.message || 'අප්ලෝඩ් කිරීම අසාර්ථකයි.';
                resultArea.className = 'result visible error';
                resultArea.innerHTML = `<strong>❌ දෝෂයකි:</strong> ${errorMsg}`;
            }
        } catch (error) {
            console.error('Error:', error);
            resultArea.className = 'result visible error';
            resultArea.innerHTML = '<strong>❌ දෝෂයක් සිදු විය.</strong> අන්තර්ජාල සම්බන්ධතාවය පරීක්ෂා කර නැවත උත්සාහ කරන්න.';
        } finally {
            uploadBtn.disabled = false;
        }
    }

    // ලින්ක් එක ක්ලිප්බෝඩ් එකට පිටපත් කිරීමේ ශ්‍රිතය
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('ලින්ක් එක ක්ලිප්බෝඩ් එකට පිටපත් කරන ලදී!');
        }).catch(() => {
            alert('පිටපත් කිරීම අසාර්ථකයි.');
        });
    }
</script>

</body>
</html>
